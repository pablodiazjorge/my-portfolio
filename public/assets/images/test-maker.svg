<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="250">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgGrad)"/>

  <!-- Header accent line -->
  <rect x="0" y="0" width="400" height="4" fill="url(#lockGrad)"/>

  <!-- Lock + shield icon -->
  <circle cx="68" cy="52" r="22" fill="#1e293b" stroke="url(#lockGrad)" stroke-width="1.5"/>
  <rect x="60" y="38" width="16" height="18" rx="3" fill="url(#lockGrad)"/>
  <path d="M54 52 Q54 38 68 38 Q82 38 82 52" stroke="url(#lockGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="68" cy="55" r="3" fill="#f8fafc"/>

  <!-- Title -->
  <text x="102" y="48" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="15" font-weight="700">TestMaker</text>
  <text x="102" y="65" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">AES-256 Encrypted Exam Platform</text>

  <!-- Divider -->
  <line x1="20" y1="82" x2="380" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- Three feature cards -->
  <!-- Card 1: Auth -->
  <rect x="20" y="98" width="112" height="64" rx="8" fill="#1e293b" opacity="0.8"/>
  <circle cx="44" cy="116" r="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <path d="M41 116 L44 119 L49 113" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="120" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">Auth</text>
  <text x="30" y="138" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Multi-user login</text>
  <text x="30" y="152" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Route guards</text>

  <!-- Card 2: Encrypt -->
  <rect x="144" y="98" width="112" height="64" rx="8" fill="#1e293b" opacity="0.8"/>
  <circle cx="168" cy="116" r="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="164" y="113" width="8" height="6" rx="1" fill="#8b5cf6"/>
  <path d="M166 118 L166 120" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="200" y="120" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">Encrypt</text>
  <text x="154" y="138" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">AES-256-CBC</text>
  <text x="154" y="152" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Serverless API</text>

  <!-- Card 3: Export -->
  <rect x="268" y="98" width="112" height="64" rx="8" fill="#1e293b" opacity="0.8"/>
  <circle cx="292" cy="116" r="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <rect x="288" y="112" width="8" height="10" rx="1" fill="#10b981"/>
  <text x="326" y="120" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">Results</text>
  <text x="278" y="138" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">PDF export</text>
  <text x="278" y="152" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Topic analytics</text>

  <!-- Bottom bar: tech stack pills -->
  <rect x="20" y="178" width="360" height="28" rx="6" fill="#1e293b" opacity="0.6"/>
  <rect x="32" y="186" width="106" height="12" rx="4" fill="#3b82f6" opacity="0.2"/>
  <text x="85" y="195" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="8">Angular 21</text>
  <rect x="148" y="186" width="64" height="12" rx="4" fill="#8b5cf6" opacity="0.2"/>
  <text x="180" y="195" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="8">Vitest</text>
  <rect x="222" y="186" width="70" height="12" rx="4" fill="#10b981" opacity="0.2"/>
  <text x="257" y="195" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8">Signals</text>
  <rect x="302" y="186" width="66" height="12" rx="4" fill="#f59e0b" opacity="0.2"/>
  <text x="335" y="195" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8">i18n</text>

  <!-- Bottom tagline -->
  <text x="200" y="232" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Built with AI assistance for real exam preparation needs</text>
</svg>
