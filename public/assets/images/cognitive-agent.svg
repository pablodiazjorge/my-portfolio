<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" rx="12" fill="#0f172a"/>
  <!-- State machine diagram -->
  <circle cx="80" cy="50" r="18" fill="#3b82f6"/>
  <text x="80" y="55" text-anchor="middle" fill="white" font-family="monospace" font-size="10">IDLE</text>
  <line x1="98" y1="50" x2="142" y2="50" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="160" cy="50" r="18" fill="#8b5cf6"/>
  <text x="160" y="55" text-anchor="middle" fill="white" font-family="monospace" font-size="8">REASON</text>
  <line x1="178" y1="58" x2="222" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="178" y1="42" x2="300" y2="42" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <circle cx="240" cy="120" r="18" fill="#10b981"/>
  <text x="240" y="125" text-anchor="middle" fill="white" font-family="monospace" font-size="9">ACTING</text>
  <line x1="240" y1="138" x2="240" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <circle cx="240" cy="190" r="18" fill="#f59e0b"/>
  <text x="240" y="195" text-anchor="middle" fill="white" font-family="monospace" font-size="8">OBSERVE</text>
  <circle cx="320" cy="42" r="18" fill="#ef4444"/>
  <text x="320" y="47" text-anchor="middle" fill="white" font-family="monospace" font-size="8">DONE</text>
  <!-- Tool icons -->
  <rect x="20" y="180" width="80" height="28" rx="6" fill="#1e293b"/>
  <text x="60" y="198" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Calculator</text>
  <rect x="110" y="180" width="80" height="28" rx="6" fill="#1e293b"/>
  <text x="150" y="198" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Weather</text>
  <rect x="200" y="180" width="80" height="28" rx="6" fill="#1e293b"/>
  <text x="240" y="198" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Search</text>
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>
</svg>
