<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="dark">

<head>
  <meta charset="utf-8">
  <title>Pablo Díaz-Jorge</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Runs before first paint: applies the persisted theme so the prerendered
    HTML is not painted dark and then flipped to light once Angular hydrates.
    Language needs no script here: each language is its own prerendered URL.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Description SEO -->
  <meta name="google-site-verification" content="6uPzmSLBQr9LlX4UsN5PwEXRFh-34mXX05Htqu9e92k" />
  <meta name="description" content="Portfolio profesional de Pablo Díaz-Jorge — Frontend Engineer especializado en Arquitectura Frontend e Ingeniería de IA. Angular, TypeScript, WebAssembly, SSE, D3.js y PostgreSQL + pgvector.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/x-icon" href="/assets/images/Logo-component.svg">
  <!-- Self-hosted Inter (latin subset, variable weight). Faces declared in styles.css -->
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!--
    Metric-compatible fallback (Arial scaled to Inter's metrics) kept here so it
    is always available at first paint, even before the full stylesheet loads.
    This keeps text from reflowing when Inter swaps in.
  -->
  <style>
    @font-face {
      font-family: "Inter Fallback";
      src: local("Arial");
      ascent-override: 90.2%;
      descent-override: 22.48%;
      line-gap-override: 0%;
      size-adjust: 107.4%;
    }
  </style>
</head>

<body class="antialiased js-focus-visible overflow-x-hidden dark:bg-d-background-primary dark:text-d-text-default light:bg-l-background-primary light:text-l-text-default">
  <app-root></app-root>
</body>

</html>
